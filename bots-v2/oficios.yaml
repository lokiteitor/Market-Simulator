    nombre: Fábrica de piensos
    rol: transformer
    tipos: [agroindustria]
    recetas: [produccion_piensos]
    capa: 4
    peso: 25 # sin piensos no hay ganadería: las 5 recetas de granja los exigen
    max_nivel: 4

  - key: molinero
    nombre: Molienda
    rol: transformer
    tipos: [agroindustria]
    recetas: [molienda, nixtamalizado]
    capa: 4
    peso: 20
    max_nivel: 3

  - key: azucarero
    nombre: Azúcar y chocolate
    rol: transformer
    tipos: [agroindustria]
    recetas: [refino_azucar, elab_chocolate]
    capa: 4
    peso: 18
    max_nivel: 3

  - key: aceitero
    nombre: Aceites y conservas
    rol: transformer
    tipos: [agroindustria]
    recetas: [prensado_aceite, salseria, enlatado_conservas]
    capa: 4
    peso: 12
