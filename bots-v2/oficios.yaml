  - key: oleaginoso
    nombre: Cultivos industriales de soya y caña
    rol: transformer
    tipos: [campo]
    recetas: [cultivo_soya, cultivo_cana]
    capa: 3
    peso: 20
    max_nivel: 3

  - key: hortelano
    nombre: Horticultura
    rol: transformer
    tipos: [campo]
    recetas: [cultivo_tomate, cosecha_frutas, cosecha_verduras]
    capa: 3
    peso: 20 # frutas y verduras van directas a las ciudades
    max_nivel: 3

  - key: cultivo_industrial
    nombre: Algodón, café y cacao
    rol: transformer
    tipos: [campo]
    recetas: [cultivo_algodon, cultivo_cafe, cultivo_cacao]
    capa: 3
    peso: 15
    max_nivel: 3

  - key: laminador
    nombre: Laminación y perfilado
    rol: transformer
    tipos: [metalurgia]
    recetas: [laminado_lamina, laminado_viga, perfilado_metal]
    capa: 3
    peso: 30
    max_nivel: 3

  - key: tubero
    nombre: Tubería de acero
    rol: transformer
    tipos: [metalurgia]
    recetas: [extrusion_tubo]
    capa: 3
    peso: 15
    max_nivel: 3

  - key: aserrador
    nombre: Aserradero
    rol: transformer
    tipos: [aserradero]
    recetas: [aserrado, tratado_madera, produccion_contrachapado]
    capa: 3
    peso: 15
    max_nivel: 3

  - key: papelero
    nombre: Celulosa y papel
    rol: transformer
    tipos: [aserradero]
    recetas: [produccion_celulosa, produccion_papel, produccion_carton]
    capa: 3
    peso: 0
    max_nivel: 2
    # La rama entera es un callejón sin salida: celulosa→papel→cartón, y el
    # cartón no lo consume ninguna receta ni es consumo final. El consumo
    # interno del propio oficio no cuenta como demanda.
    sin_demanda: true

  - key: textil
    nombre: Hilado y textil
    rol: transformer
    tipos: [agroindustria]
    recetas: [hilado_fibra, elab_textiles]
    capa: 3
    peso: 15
    max_nivel: 3

  - key: circuitero
    nombre: Circuitos y microchips
    rol: transformer
    tipos: [electronica]
    recetas: [ensamble_circuito, ensamble_microchip]
    capa: 3
    peso: 25
    max_nivel: 3

  - key: electromecanico
    nombre: Electromecánica
    rol: transformer
    tipos: [electronica]
    recetas: [ensamble_cableado, ensamble_motor_elec, ensamble_bateria]
    capa: 3
    peso: 22 # el cableado lo consumen 9 recetas
    max_nivel: 3

  - key: transmision
