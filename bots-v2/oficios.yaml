# Catálogo de OFICIOS (ADR-027) — escrito y mantenido A MANO.
#
# La unidad de especialización de bots-v2 es el oficio: un conjunto de RECETAS
# concretas, no un tipo de instalación entero como en bots-v1. El motivo está en
# el ADR, pero en corto: el round-robin de v1 daba 1/6 de la flota a las 2
# recetas del agua y otro 1/6 a las 113 industriales, y dentro de un tipo el
# nivel de la instalación es un presupuesto de concurrencia COMPARTIDO
# (ADR-021), así que un bot con nivel 3 en `componentes` nunca cubre sus 20
# recetas: cubre 3 al azar. Con oficios, quién produce qué deja de ser una
# lotería.
#
# Las recetas se nombran por su `key` de catálogo (`recipe.key`, espejo de
# `product.key`). Si el servidor es anterior a esa columna, el runner cae a
# resolver por (tipo de instalación, producto de salida) y avisa por log.
#
# Campos de un oficio:
#   key                    identificador del oficio (username y logs)
#   nombre                 etiqueta legible
#   rol                    rol con que se registra en la API (transformer|trader)
#   tipos                  tipos de instalación que está dispuesto a COMPRAR
#   recetas                claves de receta que produce (subconjunto de `tipos`)
#   capa                   profundidad en el grafo del catálogo; ordena el
#                          arranque (capa 0 = el agua, la raíz de ADR-022)
#   peso                   cuota en la flota, proporcional. 0 = solo cobertura
#   max_nivel              tope de nivel de instalación al que aspira
#   insumos_permitidos     (opc.) lista blanca de insumos; descarta recetas que
#                          consuman cualquier otra cosa
#   exigir_sin_yacimiento  (opc.) descarta recetas con insumos de yacimiento
#                          finito (ADR-023)
#   apagado                (opc.) coste_margen (default) | coste_variable
#   freno                  (opc.) precio (default) | almacen
#   inventario_max_execs   (opc.) con freno: almacen, ejecuciones de stock
#                          antes de dejar de producir
#   sin_demanda            (opc.) documenta que NINGÚN output del oficio se
#                          consume en el catálogo: ni es insumo de otra receta
#                          ni es final_consumption. Van con peso 0 porque su
#                          único destino garantizado es la quiebra; se mantiene
#                          la cobertura mínima para que el mercado exista.
version: 1

flota:
  # Bots asignados a CADA oficio antes de repartir nada por peso. Es lo que
  # garantiza que ningún eslabón nazca huérfano: con reparto puramente
  # proporcional, los oficios de peso bajo salían a cero y la cadena se
  # atascaba aguas arriba para siempre.
  cobertura_minima: 3
  # Segundos reales de separación entre capas al arrancar. La capa 0 (agua)
  # entra primero y la industria pesada al final: arrancar desde inventario
  # cero en orden inverso es lo que dejaba bids vivos en mercados que nadie
  # surtía.
  segundos_por_capa: 90

oficios:
  # === Capa 0-1: la raíz y la energía ======================================
  - key: aguador
    nombre: Aguador
    rol: transformer
    tipos: [pozo_agua]
    recetas: [pozo_agua_profundo, pozo_somero]
    capa: 0
    peso: 90 # el agua la consumen 39 recetas y solo estas dos la producen
    max_nivel: 5

  - key: hidroelectrico
    nombre: Central hidroeléctrica
    rol: transformer
    tipos: [generacion]
    recetas: [generacion_hidro]
    capa: 1
    peso: 45
    max_nivel: 4
    # Absorbe el binario bots-hidro: es la generadora MARGINAL por construcción
    # (~44 ¢/kWh contra los ~27 de la térmica de carbón), así que apagarla con
    # el criterio genérico —parar si alguien vende bajo coste+margen— la apaga
    # casi siempre. Y cuando los yacimientos de carbón y gas se agoten
    # (ADR-023) es la única generación que queda en pie.
    insumos_permitidos: [agua]
    exigir_sin_yacimiento: true
    apagado: coste_variable
    freno: almacen
    inventario_max_execs: 6

  - key: termico
    nombre: Central térmica
    rol: transformer
    tipos: [generacion]
    recetas: [central_termica_carbon, central_termica_gas]
    capa: 2
    peso: 45 # la electricidad es insumo de las 113 recetas industriales
    max_nivel: 4

  # === Capa 1: extractivas =================================================
  - key: minero_ferroso
    nombre: Minería ferrosa
    rol: transformer
    tipos: [mina]
    recetas: [mineria_hierro, mineria_carbon]
    capa: 1
    peso: 35 # hierro y carbón: el acero (34 consumidores) y las térmicas
    max_nivel: 4

  - key: minero_no_ferroso
    nombre: Minería no ferrosa
    rol: transformer
    tipos: [mina]
    recetas: [mineria_cobre, mineria_bauxita, mineria_niquel]
    capa: 1
    peso: 25
    max_nivel: 3

  - key: minero_estrategico
    nombre: Minería estratégica
    rol: transformer
    tipos: [mina]
    recetas: [mineria_litio, mineria_uranio, mineria_fosfato]
    capa: 1
    peso: 12 # fosfato→fertilizantes y litio→baterías tiran; el uranio no
    max_nivel: 3

  - key: minero_precioso
    nombre: Minería de metales preciosos
    rol: transformer
    tipos: [mina]
    recetas: [mineria_oro, mineria_plata]
    capa: 1
    peso: 15 # el oro tiene ingreso garantizado en la ventanilla del banco
    max_nivel: 3

  - key: cantero
    nombre: Cantera de roca
    rol: transformer
    tipos: [cantera]
    recetas: [cantera_caliza, cantera_piedra]
    capa: 1
    peso: 20
    max_nivel: 3

  - key: arenero
    nombre: Extracción de áridos y sal
    rol: transformer
    tipos: [cantera]
    recetas: [extraccion_arena, extraccion_arcilla, extraccion_sal]
    capa: 1
    peso: 25 # arena → vidrio, silicio y hormigón
    max_nivel: 3

  - key: petrolero
    nombre: Pozo de hidrocarburos
    rol: transformer
    tipos: [pozo]
    recetas: [pozo_petroleo, pozo_gas]
    capa: 1
    peso: 30 # base de toda la refinería y de los fertilizantes
    max_nivel: 4

  - key: semillero
    nombre: Vivero de semillas
    rol: transformer
    tipos: [campo]
    recetas: [vivero_semillas]
    capa: 1
    peso: 30 # sin semillas no hay ni un cultivo ni tala (11 consumidores)
    max_nivel: 4

  - key: maderero
    nombre: Explotación forestal
    rol: transformer
    tipos: [bosque]
    recetas: [tala]
    capa: 2
    peso: 15
    max_nivel: 3

  # === Capa 2: primera transformación ======================================
  - key: siderurgico
    nombre: Siderurgia
    rol: transformer
    tipos: [metalurgia]
    recetas: [fundicion_acero, fundicion_inox]
    capa: 2
    peso: 50 # el acero lo consumen 34 recetas: el cuello de botella industrial
    max_nivel: 4

  - key: aluminero
    nombre: Aluminio
    rol: transformer
    tipos: [metalurgia]
    recetas: [refino_aluminio, laminado_aluminio, perfilado_aluminio]
    capa: 2
    peso: 22
    max_nivel: 3

  - key: cobrero
