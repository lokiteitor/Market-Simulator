    peso: 18
    max_nivel: 3

  - key: cauchero
    nombre: Neumáticos
    rol: transformer
    tipos: [componentes]
    recetas: [ensamble_neumatico]
    capa: 3
    peso: 12
    max_nivel: 3

  - key: cerrajero
    nombre: Carpintería metálica
    rol: transformer
    tipos: [componentes]
    recetas: [ensamble_puerta, ensamble_ventana, ensamble_panel_pref]
    capa: 3
    peso: 12
    max_nivel: 3

