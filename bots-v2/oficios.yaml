    rol: transformer
    tipos: [componentes]
    recetas: [ensamble_motor, ensamble_motor_aero, ensamble_generador]
    capa: 4
    peso: 25 # el motor de combustión lo consumen 10 recetas
    max_nivel: 3

  - key: carrocero
    nombre: Chasis e interiores
    rol: transformer
    tipos: [componentes]
    recetas: [ensamble_chasis, ensamble_asiento, ensamble_panel_int]
    capa: 4
    peso: 18
    max_nivel: 3

  - key: hidraulico
    nombre: Hidráulica y depósitos
    rol: transformer
    tipos: [componentes]
    recetas: [ensamble_bomba, ensamble_hidraulico, ensamble_tuberia, ensamble_tanque]
    capa: 4
    peso: 20
    max_nivel: 3

  - key: climatizacion
