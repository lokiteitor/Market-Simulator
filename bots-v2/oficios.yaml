  - key: cementero
    nombre: Cemento y hormigón
    rol: transformer
    tipos: [materiales]
    recetas: [produccion_cemento, mezcla_hormigon]
    capa: 2
    peso: 25 # el hormigón lo consumen 10 recetas de construcción
    max_nivel: 3

  - key: vidriero
    nombre: Vidrio y cristal
    rol: transformer
    tipos: [materiales]
    recetas: [fundicion_vidrio, templado_cristal, produccion_cristal_tecnico]
    capa: 2
    peso: 18
    max_nivel: 3

  - key: ceramista
    nombre: Ladrillo y asfalto
    rol: transformer
    tipos: [materiales]
    recetas: [coccion_ladrillos, produccion_asfalto]
    capa: 2
    peso: 0
    max_nivel: 2
    sin_demanda: true # ni ladrillos ni asfalto son insumo de nada en el catálogo

  - key: fertilizante
    nombre: Fertilizantes
    rol: transformer
    tipos: [refineria]
    recetas: [produccion_fertilizantes]
    capa: 2
    peso: 30 # los consumen los 10 cultivos: sin ellos el campo no arranca
    max_nivel: 4

  - key: silicio
    nombre: Silicio
    rol: transformer
    tipos: [refineria]
    recetas: [produccion_silicio]
    capa: 2
    peso: 12
    max_nivel: 3

  - key: petroquimico
    nombre: Petroquímica
    rol: transformer
    tipos: [refineria]
    recetas: [sintesis_plastico, polimerizacion, sintesis_caucho]
    capa: 2
    peso: 28 # el plástico lo consumen 9 recetas
    max_nivel: 3

  - key: quimico
    nombre: Química de base
    rol: transformer
    tipos: [refineria]
    recetas: [sintesis_quimicos, produccion_resinas]
    capa: 2
    peso: 18
    max_nivel: 3

  - key: refinador_combustibles
    nombre: Refinería de combustibles
    rol: transformer
    tipos: [refineria]
    recetas: [refino_diesel, refino_gasolina, refino_queroseno]
    capa: 2
    peso: 0
    max_nivel: 2
    # Deliberado (ADR-022): ninguna extractiva consume combustible, porque eso
    # cerraría un ciclo en el grafo e impediría arrancar desde inventario cero.
    # El efecto colateral es que diésel, gasolina y queroseno no tienen ningún
    # comprador en el catálogo.
    sin_demanda: true

  - key: lubricantes
    nombre: Lubricantes
    rol: transformer
    tipos: [refineria]
    recetas: [refino_lubricantes, produccion_lubricante_ind]
    capa: 2
    peso: 0
    max_nivel: 2
    sin_demanda: true # el lubricante industrial no entra en ninguna receta

