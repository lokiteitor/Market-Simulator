server:
  base_url: "http://market-simulator:9080/v1"
  ws_url: "ws://market-simulator:9080/v1/ws"

logging:
  level: "info"
  format: "text" # text o json

retry:
  max_attempts: 5
  initial_backoff_ms: 1000
  max_backoff_ms: 30000

# Factor de tiempo de simulacion del servidor (env SIM_TIME_FACTOR, default 5).
# El servidor cobra el salario como wage_rate_cents_per_sec * segundos SIMULADOS,
# pero /catalog/recipes expone duration_seconds ya convertido a segundos REALES.
# DEBE coincidir con el del backend o el coste de generar queda sesgado.
sim_time_factor: 5

# Cuantas centrales lanza este proceso. Los usernames se derivan de --runner-id
# con UUID v5, asi que el parque se puede repartir entre varias maquinas.
scale: 40

# Contraseña de las cuentas autorregistradas.
password: "dev-password-123"

# Cada cuanto decide cada central (segundos reales).
tick_interval_seconds: 5

# Si el servidor rechaza una accion con 422 insufficient_capital, la central
# duerme este backoff (segundos reales) y rebasea su estado con un snapshot
# fresco, en vez de martillar la API. 0 = default del SDK (60s).
insufficient_capital_backoff_seconds: 120

# Refresco de yacimientos finitos (ADR-023, GET /catalog/deposits). La hidro no
# depende de ninguno, pero es lo que descarta las termicas: si el catalogo
# ganara una generacion "renovable" cuyo insumo si sale de yacimiento, este
# refresco es lo que la saca de la lista. 0 = default del SDK (300).
deposit_refresh_seconds: 300

# --- Estrategia hidroelectrica ----------------------------------------------
# Todos opcionales; comentados van los defaults de hidro.go.

# Tipo de instalacion que compran estas centrales.
tipo_instalacion: "generacion"

# Lista blanca de insumos (keys de producto del catalogo) que puede consumir una
# receta de ese tipo para contar como HIDROELECTRICA. Es lo que separa este bot
# del `energetico` de bots-v1: con solo `agua` dentro, las dos centrales
# termicas del catalogo (carbon y gas natural) quedan fuera y el nivel entero de
# la instalacion se dedica a generacion renovable.
insumos_renovables:
  - agua

# Tope de niveles (lineas de produccion) de la central. Mas alto que el del
# productor generico: este bot existe para acumular capacidad renovable y su
# unica receta no compite con nadie por las lineas que compra.
max_desired_level: 6

# Freno por almacen: ejecuciones de electricidad sin vender que se toleran por
# linea antes de dejar de turbinar. Como esta estrategia casi no se apaga por
# precio (es la generadora marginal por construccion), esto es lo que impide
# que siga pagando salarios contra un stock que nadie compra.
inventario_max_execs: 6

# Vista de mercado (MarketView). Todos opcionales; defaults en el SDK.
market:
  # Peso del ultimo trade en la EMA del valor justo (0-1).
  ema_alpha: 0.25
  # Banda del fair alrededor del precio base: evita fugas de precio por
  # retroalimentacion bot-a-bot. fair queda en [base*lo, base*hi].
  fair_band_lo: 0.4
  fair_band_hi: 2.5
  # Frescura del cache de top-of-book (segundos) antes de refetchear.
  top_ttl_seconds: 12
  # Llamadas REST de top-of-book por central y por tick.
  rest_budget_per_tick: 4
  # Ventana (segundos) para considerar que un producto tiene mercado "vivo".
  recent_window_seconds: 600

# Precios base (cents/unidad) para evaluar margenes.
# NO EDITAR A MANO: bloque generado por propagacion de costo desde
# infra/seed-config.json (fuente unica del catalogo) con
#   cd backend && bun src/scripts/generate-catalog-artifacts.ts
# El MISMO bloque va en bots-v1, bots-ciudad y bots-hidro: si divergen, los bots
# de mercado, las ciudades y las centrales valoran distinto lo mismo. Esta
# estrategia solo opera dos de estos productos (agua y electricidad), pero el
# bloque va completo para que el generador lo mantenga al dia sin casos
# especiales.
